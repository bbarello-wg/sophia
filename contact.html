<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact us with questions about our services.">
  <title>Contact</title>
</head>

<body>

  <header>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="about.html">About</a></li>
        <li>
          <a href="contact.html" aria-current="page">Contact</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>

    <section aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Us</h1>

      <p>
        Have a question about our services? Complete the form below
        and a member of our team will get back to you.
      </p>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Send Us a Message</h2>

      <form action="#" method="post">

        <fieldset>
          <legend>Your Contact Information</legend>

          <p>
            <label for="first-name">First Name:</label><br>
            <input
              type="text"
              id="first-name"
              name="first-name"
              autocomplete="given-name"
              required
            >
          </p>

          <p>
            <label for="last-name">Last Name:</label><br>
            <input
              type="text"
              id="last-name"
              name="last-name"
              autocomplete="family-name"
              required
            >
          </p>

          <p>
            <label for="email">Email Address:</label><br>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            >
          </p>

          <p>
            <label for="phone">Phone Number:</label><br>
            <input
              type="tel"
              id="phone"
              name="phone"
              autocomplete="tel"
            >
          </p>
        </fieldset>

        <fieldset>
          <legend>How Can We Help?</legend>

          <p>
            <label for="subject">Reason for Contact:</label><br>
            <select id="subject" name="subject" required>
              <option value="">Select an option</option>
              <option value="services">Services</option>
              <option value="general">General Question</option>
              <option value="support">Customer Support</option>
              <option value="other">Other</option>
            </select>
          </p>

          <p>
            <label for="message">Message:</label><br>
            <textarea
              id="message"
              name="message"
              rows="6"
              cols="40"
              minlength="10"
              required
            ></textarea>
          </p>

          <p>Preferred Contact Method:</p>

          <input
            type="radio"
            id="contact-email"
            name="contact-method"
            value="email"
            required
          >
          <label for="contact-email">Email</label>

          <input
            type="radio"
            id="contact-phone"
            name="contact-method"
            value="phone"
          >
          <label for="contact-phone">Phone</label>

        </fieldset>

        <p>
          <input
            type="checkbox"
            id="consent"
            name="consent"
            required
          >
          <label for="consent">
            I confirm that the information provided is accurate.
          </label>
        </p>

        <p>
          <button type="submit">Send Message</button>
          <button type="reset">Clear Form</button>
        </p>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Client Name. All rights reserved.</p>
  </footer>

<script src="js/script.js"></script>
</body>

</html>
